name: health-check

# Daily guardrail: the offline suite must stay green, and (once secrets are
# configured) live credential checks must pass too.

on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

# read-only: health checks never mutate committed state.
permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify ffmpeg
        run: ffmpeg -version && ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Init config
        run: python -m app init

      - name: Tests
        run: python -m pytest -q

      - name: Doctor (offline)
        run: python -m app doctor

      - name: Doctor (online)
        env:
          # secrets are not allowed directly in `if:` — resolve to a value first
          ONLINE: ${{ secrets.GROQ_API_KEYS != '' && secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          if [ "$ONLINE" = "true" ]; then
            python -m app doctor --online
          else
            echo "secrets not configured yet — skipping online doctor"
          fi
